<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Kannada Rajyotsava</title>
  <desc id="desc">A red and yellow Karnataka flag social sharing image.</desc>
  <defs>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe35c"/>
      <stop offset="1" stop-color="#ffc400"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f23838"/>
      <stop offset="1" stop-color="#b90000"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#240000" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="1200" height="315" fill="url(#yellow)"/>
  <rect y="315" width="1200" height="315" fill="url(#red)"/>
  <path d="M0 92 C230 26 375 166 600 92 S971 24 1200 96 V0 H0Z" fill="#fff" opacity=".11"/>
  <path d="M0 528 C228 454 400 594 600 516 S973 446 1200 529 V630 H0Z" fill="#350000" opacity=".12"/>
