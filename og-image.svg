    <text x="600" y="407" fill="#fff7cf" font-family="Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="3">RAJYOTSAVA</text>
    <path d="M426 456 H774" stroke="#ffd000" stroke-width="4" opacity=".8"/>
    <text x="600" y="507" fill="#fff7cf" font-family="Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="5">NOVEMBER 1 • KARNATAKA</text>
  </g>
  <circle cx="1110" cy="74" r="8" fill="#fff" opacity=".7"/>
  <circle cx="1084" cy="104" r="4" fill="#fff" opacity=".6"/>
  <circle cx="87" cy="560" r="7" fill="#ffd000" opacity=".75"/>
