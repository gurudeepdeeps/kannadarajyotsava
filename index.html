<script>
// --- Anthem audio from the project folder ---
const anthemAudio = new Audio('Kannadada%20Mathu%20Chenna.mp3');
let isPlaying = false;

function startAnthem() {
  const btn = document.getElementById('anthem-btn');
  const txt = document.getElementById('anthem-txt');

  anthemAudio.play().then(() => {
    isPlaying = true;
    btn.classList.add('playing');
    txt.textContent = 'Playing...';
  }).catch(() => {
    // Browsers that block unmuted autoplay can still start it from the button.
    isPlaying = false;
    btn.classList.remove('playing');
    txt.textContent = '🎵 Anthem';
  });
}

function toggleAnthem() {
  const btn = document.getElementById('anthem-btn');
  const txt = document.getElementById('anthem-txt');

  if (isPlaying) {
    isPlaying = false;
    anthemAudio.pause();
    btn.classList.remove('playing');
    txt.textContent = '🎵 Anthem';
    return;
  }

  startAnthem();
}

anthemAudio.addEventListener('ended', () => {
  isPlaying = false;
  document.getElementById('anthem-btn').classList.remove('playing');
  document.getElementById('anthem-txt').textContent = '🎵 Anthem';
});

window.addEventListener('load', startAnthem, { once: true });

const MAP_COUNT = mapCoords.length / 2;

// Total Particles
const COLS = 120;
const ROWS = 80;
const COUNT = COLS * ROWS; // 9600 particles

const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(COUNT * 3);
const targetPositions = new Float32Array(COUNT * 3);
const colors = new Float32Array(COUNT * 3);
const fireworkVelocities = new Float32Array(COUNT * 3);
let fireworkEndsAt = 0;

// Colors: Top Yellow (#FFD000), Bottom Red (#E60000)
const cYellow = new THREE.Color(0xFFD000);
const cRed = new THREE.Color(0xE60000);

// Initialize Flag Grid
let idx = 0;
for (let r = 0; r < ROWS; r++) {
  const isTop = r >= ROWS / 2;
  const col = isTop ? cYellow : cRed;
  for (let c = 0; c < COLS; c++) {
    const x = (c - COLS / 2) * 0.35;
    const y = (r - ROWS / 2) * 0.35;
    const z = 0;

    positions[idx * 3] = x;
    positions[idx * 3 + 1] = y;
    positions[idx * 3 + 2] = z;

    targetPositions[idx * 3] = x;
    targetPositions[idx * 3 + 1] = y;
    targetPositions[idx * 3 + 2] = z;

    colors[idx * 3] = col.r;
    colors[idx * 3 + 1] = col.g;
    colors[idx * 3 + 2] = col.b;

    idx++;
  }
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

// Glowing Particle Dot Texture
function getTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 64; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.35, 'rgba(255,255,255,0.7)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(canvas);
}

const material = new THREE.PointsMaterial({
  size: 0.45,
  vertexColors: true,
  map: getTexture(),
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const particleSystem = new THREE.Points(geometry, material);
scene.add(particleSystem);

// --- Mouse Interaction ---
const mouse = { x: 0, y: 0, isHover: false };
window.addEventListener('pointermove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  mouse.isHover = true;
});

// --- Morphing Modes ---
let currentMode = 'flag';

function setMode(mode, btn) {
  document.querySelectorAll('.dock-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMode = mode;

  if (mode === 'flag') generateFlag();
  if (mode === 'map') generateExactMap();
  if (mode === 'text') generateText();
  if (mode === 'galaxy') generateGalaxy();
}

function generateFlag() {
  let idx = 0;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      targetPositions[idx * 3] = (c - COLS / 2) * 0.35;
      targetPositions[idx * 3 + 1] = (r - ROWS / 2) * 0.35;
      targetPositions[idx * 3 + 2] = 0;
      idx++;
    }
  }
}

function generateExactMap() {
  let idx = 0;
  for (let i = 0; i < COUNT; i++) {
    if (i < MAP_COUNT) {
      targetPositions[idx * 3] = mapCoords[i * 2];
      targetPositions[idx * 3 + 1] = mapCoords[i * 2 + 1];
      targetPositions[idx * 3 + 2] = (Math.random() - 0.5) * 1.5;
    } else {
      const angle = Math.random() * Math.PI * 2;
      const radius = 15 + Math.random() * 8;
      targetPositions[idx * 3] = Math.cos(angle) * radius;
      targetPositions[idx * 3 + 1] = Math.sin(angle) * radius * 0.7;
      targetPositions[idx * 3 + 2] = (Math.random() - 0.5) * 6;
    }
    idx++;
  }
}

function generateText() {
  const c = document.createElement('canvas');
  c.width = 450; c.height = 200;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 450, 200);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 100px "Tiro Kannada", "Noto Sans Kannada", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('ಕನ್ನಡ', 225, 100);

  const imgData = ctx.getImageData(0, 0, 450, 200).data;
  const validPixels = [];
  for (let y = 0; y < 200; y += 2) {
    for (let x = 0; x < 450; x += 2) {
      if (imgData[(y * 450 + x) * 4] > 120) {
        validPixels.push({ x: (x - 225) * 0.11, y: -(y - 100) * 0.11 });
      }
    }
  }

  let idx = 0;
  for (let i = 0; i < COUNT; i++) {
    if (i < validPixels.length) {
      const pt = validPixels[i];
      targetPositions[idx * 3] = pt.x;
      targetPositions[idx * 3 + 1] = pt.y;
      targetPositions[idx * 3 + 2] = (Math.random() - 0.5) * 1.5;
    } else {
      const angle = Math.random() * Math.PI * 2;
      const radius = 16 + Math.random() * 8;
      targetPositions[idx * 3] = Math.cos(angle) * radius;
      targetPositions[idx * 3 + 1] = Math.sin(angle) * radius * 0.6;
      targetPositions[idx * 3 + 2] = (Math.random() - 0.5) * 8;
    }
    idx++;
  }
}

function generateGalaxy() {
  let idx = 0;
  for (let i = 0; i < COUNT; i++) {
    const arm = i % 2;
    const dist = (i / COUNT) * 16 + 1.5;
    const angle = dist * 0.8 + (arm * Math.PI);
    targetPositions[idx * 3] = Math.cos(angle) * dist + (Math.random() - 0.5) * 1.5;
    targetPositions[idx * 3 + 1] = Math.sin(angle) * dist * 0.7 + (Math.random() - 0.5) * 1.5;
    targetPositions[idx * 3 + 2] = (Math.random() - 0.5) * 4;
    idx++;
  }
}

function burstFireworks() {
  fireworkEndsAt = performance.now() + 1500;

  for (let i = 0; i < COUNT; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const speed = 14 + Math.random() * 20;
    const i3 = i * 3;

    fireworkVelocities[i3] = Math.sin(phi) * Math.cos(theta) * speed;
    fireworkVelocities[i3 + 1] = Math.sin(phi) * Math.sin(theta) * speed;
    fireworkVelocities[i3 + 2] = Math.cos(phi) * speed;

    const color = Math.random() > 0.5 ? cYellow : cRed;
    colors[i3] = color.r;
    colors[i3 + 1] = color.g;
    colors[i3 + 2] = color.b;
  }

  geometry.attributes.color.needsUpdate = true;
}

// --- Animation Loop ---
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;
  const pos = geometry.attributes.position.array;
  const fireworkActive = performance.now() < fireworkEndsAt;

  for (let i = 0; i < COUNT; i++) {
    const i3 = i * 3;

    if (fireworkActive) {
      // Keep the explosion visible instead of immediately morphing back to its shape.
      fireworkVelocities[i3 + 1] -= 12 * delta;
      pos[i3] += fireworkVelocities[i3] * delta;
      pos[i3 + 1] += fireworkVelocities[i3 + 1] * delta;
      pos[i3 + 2] += fireworkVelocities[i3 + 2] * delta;
      fireworkVelocities[i3] *= 0.985;
      fireworkVelocities[i3 + 1] *= 0.985;
      fireworkVelocities[i3 + 2] *= 0.985;
    } else {
      // Smooth lerp to target
      pos[i3] += (targetPositions[i3] - pos[i3]) * 0.085;
      pos[i3 + 1] += (targetPositions[i3 + 1] - pos[i3 + 1]) * 0.085;
      pos[i3 + 2] += (targetPositions[i3 + 2] - pos[i3 + 2]) * 0.085;
    }

    // Flag wave dynamics
    if (currentMode === 'flag' && !fireworkActive) {
      const x = pos[i3];
      pos[i3 + 2] = Math.sin(x * 0.42 - time * 3.5) * 1.8 + Math.cos(pos[i3 + 1] * 0.3 - time * 2) * 0.8;
    }

    // Subtle 3D breathing rotation for map and text
    if (currentMode === 'map' || currentMode === 'text') {
      pos[i3 + 2] += Math.sin(time * 2 + pos[i3] * 0.2) * 0.04;
    }

    // Mouse interactive dispersion
    if (mouse.isHover) {
      const dx = pos[i3] - (mouse.x * 24);
      const dy = pos[i3 + 1] - (mouse.y * 14);
      const dist = Math.hypot(dx, dy);
      if (dist < 6) {
        const force = (6 - dist) * 0.35;
        pos[i3] += (dx / dist) * force;
        pos[i3 + 1] += (dy / dist) * force;
        pos[i3 + 2] += force * 2;
      }
    }
  }

  geometry.attributes.position.needsUpdate = true;

  // Gentle camera sway
  particleSystem.rotation.y = Math.sin(time * 0.35) * 0.08;
  particleSystem.rotation.x = Math.cos(time * 0.3) * 0.04;

  renderer.render(scene, camera);
}

animate();

// --- Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
